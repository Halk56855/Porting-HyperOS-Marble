name: Port ROM - Galaxy A04 (SM-A045F)

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Device model"
        required: true
        default: "SM-A045F"
      csc:
        description: "CSC / Region code (e.g. XSG, KSA, EGY, INS)"
        required: true
        default: "XSG"
      port_rom_url:
        description: "Direct URL or Google Drive link to Port/Donor ROM archive or image"
        required: true
        default: ""
      port_version:
        description: "Port version label"
        required: false
        default: "HyperOS_Port_A045F"
      super_size:
        description: "Super partition size in bytes or 'auto'"
        required: false
        default: "auto"
      gms_from_base:
        description: "Copy GMS from base (auto | true | false)"
        required: false
        default: "auto"

env:
  TARGET_DEVICE: "SM-A045F"
  MILLET_FIX: "false"
  AOD_FIX: "false"
  ALLOW_XIAOMI_EU_EXTRAS: "false"
  BRANDING_BUILD_HOST: "false"
  ARCH64_FIX: "false"
  ARCH64_COPY_LIB: "false"
  APPS_FROM_URL: "false"
  BROWSER_FALLBACK: "auto"
  GIT_TERMINAL_PROMPT: "0"

jobs:
  build-port:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl wget unzip zip tar p7zip-full lz4 git \
            python3 python3-pip e2fsprogs android-sdk-libsparse-utils \
            build-essential pkg-config libssl-dev clang
          pip install --break-system-packages -q gdown || pip install -q gdown || true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup samloader-rs
        run: |
          set -euo pipefail
          if command -v samloader-rs >/dev/null 2>&1; then
            samloader-rs --version || true
            exit 0
          fi
          rm -rf "$HOME/samloader-rs"
          if git clone --depth=1 https://github.com/topjohnwu/samloader-rs.git "$HOME/samloader-rs"; then
            cargo install --path "$HOME/samloader-rs" --locked || \
              cargo install --path "$HOME/samloader-rs" || \
              cargo build --manifest-path "$HOME/samloader-rs/Cargo.toml" --release
            if [[ -f "$HOME/samloader-rs/target/release/samloader-rs" ]]; then
              sudo cp -f "$HOME/samloader-rs/target/release/samloader-rs" /usr/local/bin/samloader-rs
            fi
          fi
          if ! command -v samloader-rs >/dev/null 2>&1; then
            cargo install samloader --locked || cargo install samloader
          fi

      - name: Download and unpack base firmware
        env:
          SAM_MODEL: ${{ inputs.model }}
          SAM_CSC: ${{ inputs.csc }}
          SAM_IMEI: ${{ secrets.SAM_IMEI }}
          SAM_SERIAL: ${{ secrets.SAM_SERIAL }}
        run: |
          set -euo pipefail
          OUT_FW="$GITHUB_WORKSPACE/work/base_fw"
          DST_IMG="$GITHUB_WORKSPACE/work/base_src"
          TMP_UNPACK="$GITHUB_WORKSPACE/work/tmp_base"
          mkdir -p "$OUT_FW" "$DST_IMG" "$TMP_UNPACK"
          cd "$OUT_FW"

          if command -v samloader >/dev/null 2>&1; then
            samloader check-update --model "$SAM_MODEL" --region "$SAM_CSC" || true
            EXTRA_ARGS=()
            if samloader download --help 2>&1 | grep -q -- '--imei'; then
              [[ -n "${SAM_IMEI:-}" ]] && EXTRA_ARGS+=(--imei "$SAM_IMEI")
            fi
            if samloader download --help 2>&1 | grep -q -- '--serial'; then
              [[ -n "${SAM_SERIAL:-}" ]] && EXTRA_ARGS+=(--serial "$SAM_SERIAL")
            fi
            samloader download --model "$SAM_MODEL" --region "$SAM_CSC" "${EXTRA_ARGS[@]}"
          elif command -v samloader-rs >/dev/null 2>&1; then
            samloader-rs check-update --model "$SAM_MODEL" --region "$SAM_CSC" || true
            samloader-rs download --model "$SAM_MODEL" --region "$SAM_CSC"
          else
            echo "Error: samloader binary not found" >&2
            exit 1
          fi

          find "$OUT_FW" -maxdepth 2 -type f -name '*.zip' -exec unzip -q -o {} -d "$TMP_UNPACK" \;
          find "$OUT_FW" -maxdepth 2 -type f \( -name '*.tar' -o -name '*.tar.md5' \) -exec tar -xf {} -C "$TMP_UNPACK" \;
          while IFS= read -r -d '' t; do
            tar -xf "$t" -C "$TMP_UNPACK" 2>/dev/null || true
          done < <(find "$TMP_UNPACK" -maxdepth 2 -type f \( -name 'AP*.tar*' -o -name '*.tar' -o -name '*.tar.md5' \) -print0 2>/dev/null || true)
          if command -v lz4 >/dev/null 2>&1; then
            while IFS= read -r -d '' f; do
              lz4 -df --rm "$f" "${f%.lz4}" >/dev/null 2>&1 || true
            done < <(find "$TMP_UNPACK" -type f -name '*.lz4' -print0 2>/dev/null || true)
          fi
          find "$TMP_UNPACK" -type f -name '*.img' -exec cp -f {} "$DST_IMG/" \;
          [[ -n "$(find "$DST_IMG" -maxdepth 1 -name '*.img' -print -quit)" ]]

      - name: Download donor ROM and prepare update-binary
        env:
          PORT_ROM_URL: ${{ inputs.port_rom_url }}
        run: |
          set -euo pipefail
          [[ -n "$PORT_ROM_URL" ]] || { echo "port_rom_url is required" >&2; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/work/port_dl" "$GITHUB_WORKSPACE/work/build" "$GITHUB_WORKSPACE/out"

          OUT_ZIP="$GITHUB_WORKSPACE/work/port_dl/donor_rom.zip"
          COOKIE_JAR="$GITHUB_WORKSPACE/work/port_dl/gdrive_cookies.txt"
          rm -f "$OUT_ZIP" "$COOKIE_JAR"

          if printf '%s' "$PORT_ROM_URL" | grep -q 'drive\.google\.com'; then
            FILE_ID=$(printf '%s' "$PORT_ROM_URL" | grep -oE '/file/d/[a-zA-Z0-9_-]+' | sed 's|/file/d/||' | head -n 1 || true)
            if [[ -z "$FILE_ID" ]]; then
              FILE_ID=$(printf '%s' "$PORT_ROM_URL" | grep -oE '[?&]id=[a-zA-Z0-9_-]+' | sed 's/^[?&]id=//' | head -n 1 || true)
            fi
            [[ -n "$FILE_ID" ]]
            if command -v gdown >/dev/null 2>&1; then
              gdown --fuzzy "https://drive.google.com/uc?id=${FILE_ID}" -O "$OUT_ZIP" || true
            fi
            if [[ ! -s "$OUT_ZIP" ]]; then
              curl -fsSL -c "$COOKIE_JAR" -b "$COOKIE_JAR" \
                "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t" \
                -o "$OUT_ZIP" || \
              curl -fsSL -c "$COOKIE_JAR" -b "$COOKIE_JAR" \
                "https://drive.google.com/uc?export=download&id=${FILE_ID}&confirm=t" \
                -o "$OUT_ZIP"
            fi
          else
            curl -fsSL "$PORT_ROM_URL" -o "$OUT_ZIP"
          fi

          rm -f "$COOKIE_JAR"
          [[ -s "$OUT_ZIP" ]]
          if [[ "$(head -c 2 "$OUT_ZIP")" == "PK" ]]; then
            unzip -t "$OUT_ZIP" >/dev/null
          fi

          FOUND_BIN=$(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -name 'update-binary' ! -path '*/.git/*' | head -n 1 || true)
          if [[ -z "$FOUND_BIN" ]]; then
            TMP_TPL="$GITHUB_WORKSPACE/work/tmp_update_binary"
            cat <<'EOF' > "$TMP_TPL"
#!/sbin/sh
OUTFD="$2"
ZIPFILE="$3"
ui_print() {
  echo -e "ui_print $1\nui_print" > "/proc/self/fd/$OUTFD"
}
ui_print "Flashing port ROM for SM-A045F..."
exit 0
EOF
            chmod +x "$TMP_TPL"
            FOUND_BIN="$TMP_TPL"
          else
            chmod +x "$FOUND_BIN"
          fi

          for d in "$GITHUB_WORKSPACE/scripts" "$GITHUB_WORKSPACE/bin" "$GITHUB_WORKSPACE/tools" "$GITHUB_WORKSPACE/work" "$GITHUB_WORKSPACE/work/build"; do
            mkdir -p "$d"
            if [[ ! -f "$d/update-binary" ]]; then
              cp -f "$FOUND_BIN" "$d/update-binary"
              chmod +x "$d/update-binary"
            fi
          done

          chmod +x scripts/port.sh || true
          for f in scripts/port_*.sh scripts/update-binary; do
            [[ -f "$f" ]] && chmod +x "$f" || true
          done

      - name: Run port.sh for SM-A045F
        env:
          BASE_ROM: ${{ github.workspace }}/work/base_src
          PORT_ROM: ${{ github.workspace }}/work/port_dl/donor_rom.zip
          PORT_VERSION: ${{ inputs.port_version }}
          SUPER_SIZE: ${{ inputs.super_size }}
          GMS_FROM_BASE: ${{ inputs.gms_from_base }}
          OUT_DIR: ${{ github.workspace }}/out
          WORK: ${{ github.workspace }}/work/build
        run: |
          set -euo pipefail
          bash scripts/port.sh

      - name: Upload built flashable ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: port-${{ inputs.model }}-${{ inputs.csc }}
          path: out/*.zip
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ inputs.model }}
          path: |
            work/**/*.log
            out/
          if-no-files-found: ignore
