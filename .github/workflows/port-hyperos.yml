name: Port ROM - Galaxy A04 (SM-A045F)

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Device model"
        required: true
        default: "SM-A045F"
      csc:
        description: "CSC / Region code (e.g. XSG, KSA, EGY, INS)"
        required: true
        default: "XSG"
      port_rom_url:
        description: "Direct URL or Google Drive link to Port/Donor ROM archive or image"
        required: true
        default: ""
      port_version:
        description: "Port version label"
        required: false
        default: "HyperOS_Port_A045F"
      super_size:
        description: "Super partition size in bytes or 'auto'"
        required: false
        default: "auto"
      gms_from_base:
        description: "Copy GMS from base (auto | true | false)"
        required: false
        default: "auto"

env:
  TARGET_DEVICE: SM-A045F
  MILLET_FIX: "false"
  AOD_FIX: "false"
  ALLOW_XIAOMI_EU_EXTRAS: "false"
  BRANDING_BUILD_HOST: "false"
  ARCH64_FIX: "false"
  ARCH64_COPY_LIB: "false"
  APPS_FROM_URL: "false"
  BROWSER_FALLBACK: "auto"

jobs:
  build-port:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl wget unzip zip tar p7zip-full lz4 \
            python3 python3-pip e2fsprogs android-sdk-libsparse-utils \
            build-essential pkg-config libssl-dev clang

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo and samloader-rs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/samloader-rs/target
          key: samloader-rs-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install or build samloader-rs
        run: |
          if ! command -v samloader-rs >/dev/null 2>&1; then
            if [[ ! -d "$HOME/samloader-rs" ]]; then
              git clone --depth=1 https://github.com/samloader/samloader-rs.git "$HOME/samloader-rs"
            fi
            cargo install --path "$HOME/samloader-rs" --locked || cargo build --manifest-path "$HOME/samloader-rs/Cargo.toml" --release
            if [[ -f "$HOME/samloader-rs/target/release/samloader-rs" ]]; then
              sudo cp -f "$HOME/samloader-rs/target/release/samloader-rs" /usr/local/bin/samloader-rs
            fi
          fi
          samloader-rs --version

      - name: Prepare directories and permissions
        run: |
          mkdir -p "$GITHUB_WORKSPACE/work/base_src" "$GITHUB_WORKSPACE/work/port_dl" "$GITHUB_WORKSPACE/out"
          chmod +x scripts/port.sh || true
          for f in scripts/port_*.sh scripts/update-binary; do
            [[ -f "$f" ]] && chmod +x "$f" || true
          done

      - name: Download official SM-A045F firmware via samloader-rs
        env:
          SAM_MODEL: ${{ inputs.model }}
          SAM_CSC: ${{ inputs.csc }}
          SAM_IMEI: ${{ secrets.SAM_IMEI }}
          SAM_SERIAL: ${{ secrets.SAM_SERIAL }}
        run: |
          set -euo pipefail
          OUT_FW="$GITHUB_WORKSPACE/work/base_fw"
          mkdir -p "$OUT_FW"

          AUTH_ARGS=()
          if [[ -n "${SAM_IMEI:-}" ]]; then
            AUTH_ARGS+=(--imei "$SAM_IMEI")
          fi
          if [[ -n "${SAM_SERIAL:-}" ]]; then
            AUTH_ARGS+=(--serial "$SAM_SERIAL")
          fi

          samloader-rs checkupdate -m "$SAM_MODEL" -r "$SAM_CSC" "${AUTH_ARGS[@]}" || true
          samloader-rs download -m "$SAM_MODEL" -r "$SAM_CSC" "${AUTH_ARGS[@]}" -O "$OUT_FW" || \
            samloader-rs pull -m "$SAM_MODEL" -r "$SAM_CSC" "${AUTH_ARGS[@]}" -O "$OUT_FW"

          ls -lh "$OUT_FW"

      - name: Unpack base firmware and AP images
        run: |
          set -euo pipefail
          SRC_FW="$GITHUB_WORKSPACE/work/base_fw"
          DST_IMG="$GITHUB_WORKSPACE/work/base_src"
          TMP_UNPACK="$GITHUB_WORKSPACE/work/tmp_base"
          rm -rf "$DST_IMG" "$TMP_UNPACK"
          mkdir -p "$DST_IMG" "$TMP_UNPACK"

          find "$SRC_FW" -maxdepth 2 -type f -name '*.zip' -exec unzip -q -o {} -d "$TMP_UNPACK" \;
          find "$SRC_FW" -maxdepth 2 -type f \( -name '*.enc4' -o -name '*.enc2' \) -exec cp -f {} "$TMP_UNPACK/" \;
          find "$SRC_FW" -maxdepth 2 -type f \( -name '*.tar' -o -name '*.tar.md5' \) -exec tar -xf {} -C "$TMP_UNPACK" \;

          while IFS= read -r -d '' t; do
            tar -xf "$t" -C "$TMP_UNPACK" 2>/dev/null || true
          done < <(find "$TMP_UNPACK" -maxdepth 2 -type f \( -name 'AP*.tar*' -o -name '*.tar' -o -name '*.tar.md5' \) -print0 2>/dev/null || true)

          if command -v lz4 >/dev/null 2>&1; then
            while IFS= read -r -d '' f; do
              lz4 -df --rm "$f" "${f%.lz4}" >/dev/null 2>&1 || true
            done < <(find "$TMP_UNPACK" -type f -name '*.lz4' -print0 2>/dev/null || true)
          fi

          find "$TMP_UNPACK" -type f -name '*.img' -exec cp -f {} "$DST_IMG/" \;
          ls -lh "$DST_IMG"
          [[ -n "$(find "$DST_IMG" -maxdepth 1 -name '*.img' -print -quit)" ]] || {
            echo "No .img files found after unpacking base firmware" >&2
            exit 1
          }

      - name: Download and verify port donor ROM
        env:
          PORT_ROM_URL: ${{ inputs.port_rom_url }}
        run: |
          set -euo pipefail
          [[ -n "$PORT_ROM_URL" ]] || { echo "port_rom_url is required" >&2; exit 1; }

          OUT_ZIP="$GITHUB_WORKSPACE/work/port_dl/donor_rom.zip"
          COOKIE_JAR="$GITHUB_WORKSPACE/work/port_dl/gdrive_cookies.txt"
          rm -f "$OUT_ZIP" "$COOKIE_JAR"

          extract_gdrive_id() {
            local url="$1"
            if [[ "$url" =~ /file/d/([a-zA-Z0-9_-]+) ]]; then
              printf '%s\n' "${BASH_REMATCH[1]}"
              return 0
            fi
            if [[ "$url" =~ [?&]id=([a-zA-Z0-9_-]+) ]]; then
              printf '%s\n' "${BASH_REMATCH[1]}"
              return 0
            fi
            return 1
          }

          if [[ "$PORT_ROM_URL" =~ drive\.google\.com ]]; then
            FILE_ID=$(extract_gdrive_id "$PORT_ROM_URL") || {
              echo "Could not extract Google Drive file ID from URL" >&2
              exit 1
            }
            echo "Detected Google Drive file ID, downloading..."
            curl -fsSL -c "$COOKIE_JAR" -b "$COOKIE_JAR" \
              "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t" \
              -o "$OUT_ZIP" || \
            curl -fsSL -c "$COOKIE_JAR" -b "$COOKIE_JAR" \
              "https://drive.google.com/uc?export=download&id=${FILE_ID}&confirm=t" \
              -o "$OUT_ZIP"
          else
            echo "Downloading direct donor ROM URL..."
            curl -fsSL "$PORT_ROM_URL" -o "$OUT_ZIP"
          fi

          rm -f "$COOKIE_JAR"

          [[ -s "$OUT_ZIP" ]] || { echo "Downloaded donor ROM file is empty" >&2; exit 1; }

          SIZE_BYTES=$(stat -c '%s' "$OUT_ZIP")
          echo "Downloaded file size: ${SIZE_BYTES} bytes"
          if (( SIZE_BYTES < 1048576 )); then
            echo "Downloaded file is smaller than 1 MB; likely an error page or incomplete download" >&2
            exit 1
          fi

          if head -c 256 "$OUT_ZIP" | tr '[:upper:]' '[:lower:]' | grep -qE '<!doctype html|<html'; then
            echo "Downloaded file is an HTML page instead of a ROM archive (check sharing permissions or link)" >&2
            exit 1
          fi

          if [[ "$(head -c 2 "$OUT_ZIP")" == "PK" ]]; then
            unzip -t "$OUT_ZIP" >/dev/null || {
              echo "Downloaded ZIP archive is corrupted" >&2
              exit 1
            }
            echo "ZIP archive integrity check passed"
          else
            echo "Warning: downloaded file does not start with ZIP header; verify archive format" >&2
          fi

          ls -lh "$OUT_ZIP"

      - name: Run port.sh for SM-A045F
        env:
          BASE_ROM: ${{ github.workspace }}/work/base_src
          PORT_ROM: ${{ github.workspace }}/work/port_dl/donor_rom.zip
          PORT_VERSION: ${{ inputs.port_version }}
          SUPER_SIZE: ${{ inputs.super_size }}
          GMS_FROM_BASE: ${{ inputs.gms_from_base }}
          OUT_DIR: ${{ github.workspace }}/out
          WORK: ${{ github.workspace }}/work/build
        run: |
          set -euo pipefail
          bash scripts/port.sh

      - name: Upload built flashable ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: port-${{ inputs.model }}-${{ inputs.csc }}
          path: out/*.zip
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ inputs.model }}
          path: |
            work/**/*.log
            out/
          if-no-files-found: ignore
